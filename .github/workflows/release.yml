name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-22.04, args: '' }
          - { name: Windows x64, os: windows-latest, args: '' }
          - { name: macOS universal, os: macos-latest, args: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libssl-dev
      - run: pnpm install --frozen-lockfile

      - name: Detectar segredos de assinatura
        id: sign
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$APPLE_CERTIFICATE" ]; then echo "unsigned=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -z "$WINDOWS_CERTIFICATE" ]; then echo "unsigned=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then echo "updater=true" >> "$GITHUB_OUTPUT"; fi

      # TODO(TL-007): assinatura Authenticode no Windows (Azure Trusted Signing / signCommand)
      # quando WINDOWS_CERTIFICATE existir. Ver docs/release/certificados.md.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: TexLocal ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: ${{ steps.sign.outputs.updater == 'true' }}
          args: ${{ matrix.args }} ${{ steps.sign.outputs.updater == 'true' && '--config src-tauri/tauri.updater.conf.json' || '' }}

      - name: Registrar build sem assinatura
        if: steps.sign.outputs.unsigned == 'true'
        shell: bash
        run: echo "${{ matrix.name }}" > unsigned.txt
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.unsigned == 'true'
        with:
          name: unsigned-${{ runner.os }}
          path: unsigned.txt

  publish:
    name: Checksums e publicação
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: unsigned-*
          path: unsigned
      - name: SHA256SUMS, notas e publicação
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.deb' --pattern '*.AppImage' --pattern '*.msi' \
            --pattern '*.dmg' --pattern '*.sig' --pattern 'latest.json'
          sha256sum * > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          cd ..
          if ls unsigned/*/unsigned.txt >/dev/null 2>&1; then
            body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
            list="$(cat unsigned/*/unsigned.txt | paste -sd, -)"
            printf '%s\n\n> **Unsigned:** build sem assinatura de SO em: %s\n' "$body" "$list" > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
