name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-22.04
    steps:
      # Configure RELEASE_PLEASE_TOKEN (PAT ou GitHub App) para que a tag criada dispare o workflow release.yml;
      # com o GITHUB_TOKEN padrão o GitHub não dispara outros workflows.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
