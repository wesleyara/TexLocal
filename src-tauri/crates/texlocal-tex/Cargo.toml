[package]
name = "texlocal-tex"
description = "Gerenciamento do TeX Live e compilação do TexLocal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
directories = "6.0.0"
flate2 = "1.1.11"
fs4 = "1.1.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
toml = "1.2.1"
ureq = "3.5.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
