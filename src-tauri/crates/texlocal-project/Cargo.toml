[package]
name = "texlocal-project"
description = "Arquivos, índice, busca, contagem de palavras e ortografia de projetos LaTeX"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
spellbook = "0.4"

[dev-dependencies]
tempfile = "3"
